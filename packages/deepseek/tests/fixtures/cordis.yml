- id: llm
  name: '@codexydsh/runtime/llm'
- id: codexy-requests
  name: '@codexydsh/bridges'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@codexydsh/runtime/prompt'
- id: codexy-prompt
  name: '@codexydsh/prompt-registry'
- name: '@codexydsh/bridges/tools'
- id: codexy-tools
  name: '@codexydsh/bridges/tool-port'
- name: '@deepseek-ai/dsh-agent'
- name: '@codexydsh/runtime'
  config:
    agents: []
- name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- id: llm-deepseek
  name: '@codexydsh/deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
